  const my=++texToken;            // ignore late responses from a planet we already left

  globe.material.map=null;globe.material.color.set(PLANETS[p].color);globe.material.needsUpdate=true;
  texState={planet:p,status:'loading'};showTexStatus();
  const urls=TEX[p]; let i=0;
  const tryLoad=()=>{
    if(my!==texToken) return;
    if(i>=urls.length){ texState={planet:p,status:'fail'};showTexStatus(); return; }
    loader.load(urls[i],tex=>{tex.colorSpace=THREE.SRGBColorSpace;texCache[p]=tex;if(my!==texToken)return;applyTex(tex);texState={planet:p,status:'ok'};showTexStatus();},
      undefined,()=>{i++;tryLoad();});
  }; tryLoad();
}

function freeBand(){
  const nav=$('planet-nav').getBoundingClientRect(), dock=$('twin-nav').getBoundingClientRect();
  const top=nav.bottom+10, bot=dock.top-26;
  return {top, bot, A:Math.max(180,bot-top)};

  if(isPhone()) return 4.4;
  const {A}=freeBand(), R=A/2, tanH=Math.tan(camera.fov*Math.PI/360), rho=1.04;
  const k=(innerHeight/2)/(R*tanH);

const _v=new THREE.Vector3(), _c=new THREE.Vector3();
function updateMarkers(){
  const w=innerWidth,h=innerHeight, vis=[];
  _c.copy(camera.position).normalize();
  SITES.forEach(s=>{
    if(!s._m||s.planet!==currentPlanet)return;
    _v.copy(latLonToVec(s.lat,s.lon)).applyMatrix4(globe.matrixWorld);
    const on=_v.clone().normalize().dot(_c)>0.25;
    _v.project(camera);
    const x=(_v.x*0.5+0.5)*w, y=(-_v.y*0.5+0.5)*h;
    s._m.style.display=on?'block':'none';

  });

}

   Each label tries positions around its dot (top, right, left, bottom, diagonals, then farther out
   with a thin leader line) and takes the first that does not overlap another label or dot.
   The active site is placed first; each label prefers its previous spot so labels don't jump while the globe turns. */
const LAB_GAP=4, DOT_R=10, LAB_OFF=13;
function labelCandidates(w,h){
  const c=[
    [-w/2,-h-LAB_OFF],            // 0 top (default)
    [LAB_OFF,-h/2],               // 1 right
    [-w-LAB_OFF,-h/2],            // 2 left
    [-w/2,LAB_OFF],               // 3 bottom
    [LAB_OFF-4,-h-LAB_OFF+4],     // 4 top-right
    [-w-LAB_OFF+4,-h-LAB_OFF+4],  // 5 top-left
    [LAB_OFF-4,LAB_OFF-4],        // 6 bottom-right
    [-w-LAB_OFF+4,LAB_OFF-4]      // 7 bottom-left
  ];
  for(let k=1;k<=3;k++){          // 8+ farther away -> leader line is drawn
    const d=k*(h+LAB_GAP+2);
    c.push([-w/2,-h-LAB_OFF-d],[-w/2,LAB_OFF+d],[LAB_OFF+12*k,-h/2-d],[LAB_OFF+12*k,-h/2+d],[-w-LAB_OFF-12*k,-h/2-d],[-w-LAB_OFF-12*k,-h/2+d]);
  }
  return c;
}
const ovl=(a,b,g)=>Math.max(0,Math.min(a.x+a.w+g,b.x+b.w)-Math.max(a.x-g,b.x))*Math.max(0,Math.min(a.y+a.h+g,b.y+b.h)-Math.max(a.y-g,b.y));
function layoutLabels(list,W,H){
  if(!list.length) return;
  list.forEach(o=>{
    const lab=o.s._m.querySelector('.lab');
    if(!o.s._lw){ o.s._lw=lab.offsetWidth; o.s._lh=lab.offsetHeight; }
    o.lab=lab;
  });
  const dots=list.map(o=>({x:o.x-DOT_R,y:o.y-DOT_R,w:DOT_R*2,h:DOT_R*2,s:o.s}));
  const placed=[];
  list.sort((a,b)=>((b.s===current)-(a.s===current))||(a.y-b.y));
  list.forEach(o=>{
    const lw=o.s._lw, lh=o.s._lh, cand=labelCandidates(lw,lh);
    const order=[...cand.keys()];
    if(o.s._li>=0&&o.s._li<cand.length){ order.splice(order.indexOf(o.s._li),1); order.unshift(o.s._li); }
    let best=-1, bestScore=Infinity;
    for(const i of order){
      const r={x:o.x+cand[i][0],y:o.y+cand[i][1],w:lw,h:lh};
      let sc=0;
      placed.forEach(p=>sc+=ovl(r,p,LAB_GAP));
      dots.forEach(d=>{ if(d.s!==o.s) sc+=ovl(r,d,2)*2; });
      if(r.x<4) sc+=(4-r.x)*lh; if(r.x+lw>W-4) sc+=(r.x+lw-W+4)*lh;   // keep inside the screen
      if(r.y<4) sc+=(4-r.y)*lw; if(r.y+lh>H-4) sc+=(r.y+lh-H+4)*lw;
      if(i>=8) sc+=1;                                                // small cost for being far away
      if(sc<bestScore){ bestScore=sc; best=i; }
      if(sc===0) break;
    }
    o.s._li=best;
    const [dx,dy]=cand[best];
    placed.push({x:o.x+dx,y:o.y+dy,w:lw,h:lh});
    o.lab.style.transform=`translate(${14+dx}px,${14+dy}px)`;
    o.s._m.style.zIndex=o.s===current?23:(best>=8?21:20);
    // leader line from the dot to the nearest edge of a far label
    const lead=o.s._m.querySelector('.lead');
    if(best>=8){
      const tx=Math.max(dx,Math.min(0,dx+lw)), ty=Math.max(dy,Math.min(0,dy+lh));
      const len=Math.hypot(tx,ty), ang=Math.atan2(ty,tx);
      lead.style.display='block'; lead.style.width=`${Math.max(0,len-6)}px`;
      lead.style.transform=`rotate(${ang}rad) translateX(6px)`;
    } else lead.style.display='none';
  });
}

/* ---------- formatting ---------- */
function fmtCoords(lat,lon){
  const lo=((lon+540)%360)-180;
  return `${nf(Math.abs(lat),2)}° ${lat>=0?'N':'S'}, ${nf(Math.abs(lo),2)}° ${lo>=0?'E':'W'}`;
}
function fmtFact(f){
  if(f.t) return L(f.t);
  return `${f.a?'≈ ':''}${nf(f.v)} ${L(UNITS[f.u])}`;
}
function factCell(label,value,note,span){
  return `<div class="rounded-lg bg-white/5 p-2${span?' col-span-2':''}"><div class="text-[10px] text-gray-400">${label}</div><div class="font-bold">${value}</div>${note?`<div class="text-[10px] text-gray-400">${note}</div>`:''}</div>`;
}
const pairMembers = s => SITES.filter(x=>x.pair===s.pair);

/* ---------- panel ---------- */
let shownImgFor=null;
function renderPanel(){

  $('p-facts').innerHTML = s.facts.map(f=>factCell(L(FACT_LABEL[f.k]),fmtFact(f),f.n?L(f.n):'')).join('') +

              `${nf(pl.diameter,0)} km · ${L(pl.day)} · ${L(pl.pressure)}`, 'NASA Planetary Fact Sheet', true);
  $('p-approx').textContent=t.approx;
  $('p-ref').textContent=s.ref;
  renderScale(); renderGravity();
}
function renderScale(){
  const t=T[lang], s=current;
  const mates=pairMembers(s).filter(x=>x.id!==s.id);
  let html='';
  mates.forEach(m=>{
    COMPARABLE.forEach(k=>{
      const a=s.facts.find(f=>f.k===k&&f.v!=null), b=m.facts.find(f=>f.k===k&&f.v!=null);
      if(!a||!b||a.u!==b.u) return;
      const big=Math.max(a.v,b.v), r=a.v/b.v;
      const lab=L(FACT_LABEL[k]).toLowerCase();
      const R=Math.max(r,1/r), bigN=r>=1?L(s.name):L(m.name), smallN=r>=1?L(m.name):L(s.name);
      let sentence = (R<1.2) ? `${L(s.name)} ≈ ${L(m.name)} (${lab}: ${t.same})` : t.scaleSentence(bigN,smallN,nf(R,R<10?1:0),lab);
      sentence = sentence.charAt(0).toUpperCase()+sentence.slice(1);
      html+=`<div><div class="mb-1">${sentence}</div>
        <div class="flex items-center gap-2"><span class="w-20 truncate text-gray-300">${L(s.name)}</span><div class="flex-1"><div class="bar" style="width:${a.v/big*100}%;background:${s.color}"></div></div><span class="w-16 text-right font-mono">${nf(a.v)} ${L(UNITS[a.u])}</span></div>
        <div class="flex items-center gap-2 mt-1"><span class="w-20 truncate text-gray-300">${L(m.name)}</span><div class="flex-1"><div class="bar" style="width:${b.v/big*100}%;background:${m.color}"></div></div><span class="w-16 text-right font-mono">${nf(b.v)} ${L(UNITS[b.u])}</span></div></div>`;
    });
  });
  $('p-scale').innerHTML = html || `<p class="text-gray-400">${t.scaleNone}</p>`;
}
function renderGravity(){
  const jump=Math.max(0,+$('in-jump').value||0), mass=Math.max(0,+$('in-mass').value||0);
  $('grav-rows').innerHTML=['earth','moon','mars'].map(p=>{

}

function selectSite(id,fly){

/* ---------- camera fly: arcs around the globe (no flying through it), aims at the ROTATED globe ---------- */
let flyAnim=null;
function cancelFly(){ if(flyAnim){cancelAnimationFrame(flyAnim);flyAnim=null;} }
function flyTo(lat,lon){
  cancelFly();
  const camLat=Math.max(-70,Math.min(70,lat));                 // look at polar sites obliquely
  const endDir=latLonToVec(camLat,lon,1).applyQuaternion(globe.quaternion).normalize();
  const startDir=camera.position.clone().normalize();
  const d0=camera.position.length(), d1=isPhone()?4.4:Math.max(3.0,fitDistance());
  const q=new THREE.Quaternion().setFromUnitVectors(startDir,endDir), qi=new THREE.Quaternion();
  if(reduceMotion){camera.position.copy(endDir.multiplyScalar(d1));return;}
  const t0=performance.now();
  const step=t=>{
    const k=Math.min(1,(t-t0)/1200), e=1-Math.pow(1-k,3);
    qi.identity().slerp(q,e);
    camera.position.copy(startDir).applyQuaternion(qi).multiplyScalar(d0+(d1-d0)*e);
    flyAnim = k<1 ? requestAnimationFrame(step) : null;
  };
  flyAnim=requestAnimationFrame(step);
}
controls.addEventListener('start',()=>{cancelFly();pauseRotateUntil=performance.now()+20000;});

function switchPlanet(p,silent){
  cancelFly();                                   // never keep flying toward a site of the previous planet
  currentPlanet=p;
  document.querySelectorAll('.planet-btn').forEach(b=>{
    const on=b.dataset.planet===p;
    b.setAttribute('aria-pressed',on?'true':'false');
    b.classList.remove('bg-blue-500','bg-gray-200','text-black','bg-red-500','text-gray-300');
    if(on) b.classList.add(...(p==='earth'?['bg-blue-500']:p==='moon'?['bg-gray-200','text-black']:['bg-red-500']));
    else b.classList.add('text-gray-300');
  });
  atmo.visible = p==='earth';
  loadPlanet(p); renderMarkers();
  if(!silent){const first=SITES.find(s=>s.planet===p); if(first) selectSite(first.id,false);}
}

function qSite(s){
